# Postgres local para desarrollo y tests. Misma versión mayor que Supabase.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: caro
      POSTGRES_PASSWORD: caro
      POSTGRES_DB: caro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caro"]
      interval: 2s
      timeout: 3s
      retries: 15
